name: build
on:
  push:
    branches: [main]
    paths: ['build/**', '.github/workflows/build.yml']
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: run logic tests and rebuild index.html
        run: python3 build/build.py index.html
      - name: commit rebuilt page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --staged --quiet || git commit -m "rebuild index.html [skip ci]"
          git push
